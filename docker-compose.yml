services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loveitseasy
      POSTGRES_PASSWORD: loveitseasy
      POSTGRES_DB: loveitseasy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Локальная замена S3-хранилища RU-провайдера (Timeweb/Yandex) на время
  # разработки — тот же S3-совместимый протокол, реальный провайдер
  # подключается только сменой S3_* переменных в .env (AGENTS.md §2, §7).
  # RustFS вместо MinIO: образ minio/minio удалён с Docker Hub. Порты те же:
  # 9000 — S3 API, 9001 — веб-консоль. Версия зафиксирована осознанно.
  s3:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: loveitseasy
      RUSTFS_SECRET_KEY: loveitseasy123
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Одноразовый контейнер: создаёт бакет loveitseasy и завершается.
  # Подписанный S3-запрос через curl --aws-sigv4 (curl есть в образе RustFS);
  # повторное создание существующего бакета RustFS тоже отвечает 200.
  s3-init:
    image: rustfs/rustfs:1.0.0
    depends_on:
      s3:
        condition: service_healthy
    entrypoint:
      - curl
      - -fsS
      - --aws-sigv4
      - aws:amz:us-east-1:s3
      - --user
      - loveitseasy:loveitseasy123
      - -X
      - PUT
      - http://s3:9000/loveitseasy

  # Self-hosted NSFW-модерация (AGENTS.md §2, §7 — не заменять на платный
  # внешний SaaS без обсуждения). На проде — тот же образ на VPS.
  nsfw:
    build: ./services/nsfw
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  s3_data:
